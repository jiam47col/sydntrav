        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

// 智慧天氣 API (包含 GPS 真實地名抓取與 5 小時動態校正)
        async function fetchSmartWeather() {
            // 預設雪梨座標 (GPS 失敗時的備案)
            let lat = -33.8688;
            let lon = 151.2093;
            let locationName = "雪梨 (預設)";

            const fetchWeatherAndRender = async () => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto&forecast_days=2`);
                    const data = await res.json();
                    
                    const current = data.current_weather;
                    const hourly = data.hourly;
                    const now = new Date();
                    
                    let currentIndex = hourly.time.findIndex(t => new Date(t) >= now);
                    if (currentIndex === -1) currentIndex = 0;
                    
                    // 新增一個小助手，用來把 API 數字轉換成圖示
                    const getIconByCode = (code) => {
                      if (code >= 1 && code <= 3) return "cloud-sun";
                      if (code >= 45 && code <= 48) return "cloud-fog";
                      if (code >= 51 && code <= 82) return "cloud-rain";
                      if (code >= 95) return "cloud-lightning";
                      return "sun"; 
                    };

                    let nextHours = [];
                    for(let i = 0; i < 5; i++) {
                       let targetIdx = currentIndex + i;
                       if(targetIdx < hourly.time.length) {
                           nextHours.push({
                               time: hourly.time[targetIdx].substring(11, 16),
                               temp: Math.round(hourly.temperature_2m[targetIdx]) + "°",
                               rain: hourly.precipitation_probability[targetIdx] + "%",
                               icon: getIconByCode(hourly.weathercode[targetIdx]) 
                           });
                       }
                    }

                    // 【修正點】：取得當下天氣的圖示
                    const currentIcon = getIconByCode(current.weathercode);
                    
                    liveWeather = { 
                        temp: Math.round(current.temperature), 
                        hourly: nextHours, 
                        icon: currentIcon, // 【修正點】：把原本報錯的 icon 換成剛剛取得的 currentIcon
                        locationName: locationName 
                    };
                    if (currentTab === 'itinerary') render();
                } catch (e) {
                    console.log("氣象API請求失敗", e);
                }
            };

            // 免費的逆地理編碼 API，將經緯度轉為真實地名
            const fetchLocationName = async (latitude, longitude) => {
                try {
                    const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=zh`);
                    const geoData = await geoRes.json();
                    return geoData.locality || geoData.city || "所在位置";
                } catch (e) {
                    return "GPS 即時";
                }
            };

            // 啟動 GPS 定位
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        lat = position.coords.latitude;
                        lon = position.coords.longitude;
                        // 成功取得 GPS 後，轉換地名
                        locationName = await fetchLocationName(lat, lon);
                        fetchWeatherAndRender();
                    },
                    (error) => {
                        console.log("GPS 被拒絕或失敗，使用預設", error);
                        fetchWeatherAndRender();
                    },
                    { timeout: 5000 }
                );
            } else {
                fetchWeatherAndRender();
            }
        }

                // --- 2. 距離運算與資料處理 (進入 nearby 或 all 狀態) ---
                function getDistance(lat1, lon1, lat2, lon2) {
                    const R = 6371; 
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLon = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                              Math.sin(dLon/2) * Math.sin(dLon/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    return R * c;
                }

                // 取得當前 GPS 座標，若無則預設為雪梨市中心 (QVB 附近)

                        ${appData.expenses.length > 0 ? `<button onclick="toggleExpenseEditMode()" class="text-[12px] font-bold px-4 py-1.5 rounded-full transition-all shadow-sm ${isExpenseEditMode ? 'bg-[var(--text-primary)] text-white' : 'bg-white border border-[var(--border-glass)] text-[var(--text-secondary)] hover:text-[var(--text-primary)]'}">${isExpenseEditMode ? '完成管理' : '管理紀錄'}</button>` : ''}
                    </div>

                    <!-- 歷史紀錄列表 -->
                    <div class="space-y-4 fade-in pb-10 relative z-10">
                        ${editBarHtml}
                        ${Object.keys(groupedExp).length === 0 ? '<p class="text-center text-[13px] text-[var(--text-secondary)] font-medium mt-6">目前尚無紀錄</p>' : ''}
                        ${Object.entries(groupedExp).map(([date, exps]) => `
                            <div>
                                <h3 class="text-[11px] font-bold text-[var(--text-secondary)] mb-2 pl-1">${date}</h3>
                                <div class="space-y-3">
                                    ${exps.map(exp => {
                                        const cat = exp.category || '其他'; 
                                        const descHtml = exp.desc ? `<span class="text-[12px] font-medium text-[var(--text-secondary)] mt-1 block truncate">${escapeHTML(exp.desc)}</span>` : '';
                                        const isSelected = selectedExpenses.has(exp.timestamp);
                                        
                                        let actionHtml = '';
                                        if (isExpenseEditMode) {
                                            // 編輯模式：顯示打勾框
                                            actionHtml = `
                                                <div class="flex items-center gap-4 shrink-0 pointer-events-none">
                                                    <span class="text-[18px] font-bold text-[var(--text-primary)]">$${exp.twd?.toLocaleString() || Math.round(exp.aud * AUD_RATE).toLocaleString()}</span>
                                                    <div class="w-[32px] h-[32px] flex items-center justify-center">
                                                        <div class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors ${isSelected ? 'border-[var(--text-primary)] bg-[var(--text-primary)]' : 'border-[var(--border-glass)] bg-white'}">
                                                            <i data-lucide="check" class="w-3.5 h-3.5 text-white ${isSelected ? '' : 'scale-0'} transition-transform"></i>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        } else {
    // 一般模式：顯示編輯與刪除按鈕
                                            actionHtml = `
                                                <div class="flex items-center gap-2.5 shrink-0">
                                                     <span class="text-[18px] font-bold text-[var(--text-primary)]">$${exp.twd?.toLocaleString() || Math.round(exp.aud * AUD_RATE).toLocaleString()}</span>
            
            <!-- 這是新加的編輯按鈕 -->
                                                <button onclick="editExpense(${exp.timestamp}); event.stopPropagation();" class="p-1.5 bg-gray-100 text-[var(--text-secondary)] rounded-full hover:bg-gray-200 transition-colors shadow-sm active:scale-90"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
            
            <!-- 這是原本的刪除垃圾桶 -->
                                                <button onclick="deleteExpense(${exp.timestamp}); event.stopPropagation();" class="p-1.5 bg-[#FFF0F0] text-[#FF3B30] rounded-full hover:bg-[#FFE5E5] transition-colors shadow-sm active:scale-90"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                                </div>
                                                 `;
                                            }

                                        return `
                                        <div class="glass-card px-5 py-4 flex justify-between items-center shadow-sm transition-transform ${isExpenseEditMode ? 'cursor-pointer active:scale-[0.98]' : ''}" ${isExpenseEditMode ? `onclick="toggleExpenseSelection(${exp.timestamp})"` : ''}>
                                            <div class="flex-1 pr-4 min-w-0">
                                                <div class="flex items-center gap-2">
                                                    <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${categoryColors[cat] || '#E5E5EA'}"></div>
                                                    <span class="text-[15px] font-bold text-[var(--text-primary)] truncate block">${cat}</span>
                                                </div>
                                                ${descHtml}
                                            </div>
                                            ${actionHtml}
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function switchTab(tabId) { 
            currentTab = tabId; 
            render(tabId === 'itinerary'); 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }
        function selectDate(id) { 
            selectedDayId = id; 
            render(true); 
            setTimeout(() => { const btn = document.getElementById(`btn-${id}`); if (btn) btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }, 50); 
        }
        function setPrepTab(tab) { prepTab = tab; render(); }
        function toggleChartView() { isChartView = !isChartView; render(); }
        
        // 台幣無動畫瞬間連動，顏色加深
        function updateTwdEstimate() {
            const aud = document.getElementById('aud-input').value;
            const twdElem = document.getElementById('twd-estimate');
            if (aud && !isNaN(aud) && aud > 0) {
                twdElem.innerText = `= $${Math.round(aud * AUD_RATE).toLocaleString()} TWD`;
                twdElem.classList.remove('text-gray-300');
                twdElem.classList.add('text-gray-800');
            } else {
                twdElem.innerText = `= $0 TWD`;
                twdElem.classList.remove('text-gray-800');
                twdElem.classList.add('text-gray-300');
            }
        }

        function toggleCheck(checkbox, itemName) {
            const icon = checkbox.nextElementSibling;
            const text = checkbox.parentElement.nextElementSibling;
            const box = checkbox.parentElement;
            appData.checkItems[itemName] = checkbox.checked;
            saveData();
            if(checkbox.checked) {
                icon.classList.remove('scale-0'); text.classList.add('strikethrough'); box.classList.add('border-gray-800', 'bg-gray-800');
            } else {
                icon.classList.add('scale-0'); text.classList.remove('strikethrough'); box.classList.remove('border-gray-800', 'bg-gray-800');
            }
        }

        function addCustomEvent() {
            const dayId = document.getElementById('add-day').value;
            const time = document.getElementById('add-time').value;
            const title = document.getElementById('add-title').value;
            const desc = document.getElementById('add-desc').value;
            if(title) {
                if(!appData.customEvents[dayId]) appData.customEvents[dayId] = [];
                appData.customEvents[dayId].push({ time, title, desc, mapQuery: title });
                saveData(); 
                alert('行程已成功寫入！');
                switchTab('itinerary');
            }
        }

        function deleteCustomEvent(dayId, originalIndex) {
            if (confirm('確定要刪除這個自訂行程嗎？')) {
                appData.customEvents[dayId].splice(originalIndex, 1);
                saveData();
                render(false);
            }
        }

        
        
		// 1. 新增編輯函式
        // 1. 新增編輯函式 (修正執行順序版)
        function editExpense(timestamp) {
        // 找出要編輯的那筆資料
        const exp = appData.expenses.find(e => e.timestamp === timestamp);
        if (!exp) return;
    
        // 步驟 A：先記錄狀態
        selectedCategory = exp.category;
        editingExpenseId = timestamp;
    
        // 步驟 B：「先」重新渲染畫面 (這樣分類按鈕的顏色才會切換過去)
        render(); 
    
        // 步驟 C：「後」把資料填回輸入框 (順序很重要，否則會被 render 清空！)
        document.getElementById('aud-input').value = exp.aud;
        document.getElementById('exp-desc').value = exp.desc || '';
        updateTwdEstimate(); // 重新計算台幣預估
 
        // 畫面自動捲動到最上方輸入區
        window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 2. 修改原本的 addExpense() 讓它支援「儲存」
        function addExpense() {
        const aud = parseFloat(document.getElementById('aud-input').value);
        const desc = document.getElementById('exp-desc').value || '';
        if(aud && aud > 0) {
        const twd = Math.round(aud * AUD_RATE);
        
        if (editingExpenseId) {
            // 編輯模式：更新舊資料
            const index = appData.expenses.findIndex(e => e.timestamp === editingExpenseId);
            if (index !== -1) {
                appData.expenses[index].aud = aud;
                appData.expenses[index].twd = twd;
                appData.expenses[index].desc = desc;
                appData.expenses[index].category = selectedCategory;
            }
            editingExpenseId = null; // 清除編輯狀態
        } else {
            // 新增模式：原本的邏輯
            const today = new Date();
            const dateStr = (today.getMonth() + 1) + '/' + today.getDate();
            appData.expenses.unshift({ aud, twd, desc, category: selectedCategory, date: dateStr, timestamp: Date.now() });
        }
        
        saveData(); 
        render();
        } else {
            alert('請輸入有效的澳幣金額！');
            }
        } 
				
        function openModal(id, encodedGuide) {
            if(encodedGuide) {
                const guide = JSON.parse(decodeURIComponent(encodedGuide));
                document.getElementById('modal-title').innerText = guide.title;
                let textHtml = '';
                if(Array.isArray(guide.text)) {
                    textHtml = guide.text.map(p => `<p>${p.replace(/\*\*(.*?)\*\*/g, '<span class="font-bold text-[var(--text-primary)]">$1</span>')}</p>`).join('');
                } else {
                    textHtml = `<p>${guide.text}</p>`;
                }
                document.getElementById('modal-text').innerHTML = textHtml;
                if(guide.images && guide.images.length > 0) {
                    document.getElementById('modal-images').innerHTML = guide.images.map(url => `<img src="${url}" class="shrink-0 w-[85%] snap-center h-48 object-cover rounded-2xl shadow-sm border border-gray-100" loading="lazy">`).join('');
                    document.getElementById('modal-images').style.display = 'flex';
                } else {
                    document.getElementById('modal-images').style.display = 'none';
                }
            }
            const modal = document.getElementById(id);
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); modal.classList.add('modal-open'); }, 10);
        }
        
        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('modal-open'); modal.classList.add('opacity-0'); setTimeout(() => modal.classList.add('hidden'), 300);
        }
        function openEmergency() { openModal('emergency-modal'); }
        		// 免費的地圖預覽 Modal
                function openMapModal(name, lat, lng, distKm, walkMins) {
                document.getElementById('modal-title').innerText = name;
                document.getElementById('modal-images').style.display = 'none'; // 隱藏原本的圖片輪播區

    // 使用免 API Key 的 Google Maps Embed URL
                const mapEmbedUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;

    // 重新組合 Modal 的內容
                document.getElementById('modal-text').innerHTML = `
                    <div class="flex gap-4 mb-3 text-[13px] font-bold text-[var(--text-secondary)]">
                        <span class="flex items-center gap-1"><i data-lucide="footprints" class="w-4 h-4"></i>步行約 ${walkMins} 分鐘</span>
                        <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4"></i>距離 ${distKm} km</span>
                    </div>
                    <div class="w-full h-[250px] rounded-xl overflow-hidden shadow-inner border border-gray-200 mb-4 bg-gray-100">
                        <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="${mapEmbedUrl}"></iframe>
                    </div>
                    <div class="flex gap-2">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="flex-1 bg-[var(--text-primary)] text-white text-center py-3 rounded-xl font-bold text-[14px] shadow-sm active:scale-95 transition-transform flex justify-center items-center gap-1.5">
                        <i data-lucide="external-link" class="w-4 h-4"></i> 前往 Google Maps
                        </a>
                    </div>
                `;

    // 顯示 Modal
                const modal = document.getElementById('global-modal');
                modal.classList.remove('hidden'); 
                setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                modal.classList.add('modal-open'); 
                    lucide.createIcons();
                    }, 10);
                }
				
				// App 初始化時的情境判斷
                const initNow = new Date();
                const initMonth = initNow.getMonth() + 1;
                const initDate = initNow.getDate();

                if (initMonth < 8 || (initMonth === 8 && initDate < 5)) {
    // 8/5 之前：行前準備期
                currentTab = 'prep';
                } else if (initMonth === 8 && initDate >= 5 && initDate <= 10) {
                // 8/5 ~ 8/10：旅程中，自動跳到對應的那一天
                currentTab = 'itinerary';
                const activeDay = travelData.days.find(d => d.date === `8/${initDate}`);
                if(activeDay) selectedDayId = activeDay.id;
                 } else {
    // 8/10 之後：旅程結束，看記帳與回憶
                currentTab = 'tools';
                }
        // 啟動 App
        render(true); 
        fetchSmartWeather(); // 呼叫具備 GPS 的智慧天氣
    </script>
</body>
